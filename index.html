<!DOCTYPE html>
<html lang="lv" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EAN Mobilais Skeneris Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    @keyframes scanLaser {
      0% { top: 6%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.8; }
    }
    .scanner-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 2.5px;
      background: #10b981;
      box-shadow: 0 0 14px 3px rgba(16, 185, 129, 0.9);
      animation: scanLaser 1.4s ease-in-out infinite;
      pointer-events: none;
      z-index: 10;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 1.25rem;
      width: 100% !important;
      height: 100% !important;
    }
    .numkey:active {
      transform: scale(0.94);
      background-color: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased select-none touch-manipulation overflow-hidden">

  <!-- Augšējā josla -->
  <header class="px-3.5 py-2 bg-slate-900 border-b border-white/10 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div id="mqttStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div>
      <div>
        <div class="flex items-center gap-1.5 leading-none">
          <span id="displayDeviceId" class="text-xs font-bold font-mono tracking-tight text-white">Ierīce</span>
          <span class="text-[10px] text-slate-400 font-mono" id="displayRoomId">(@telpa)</span>
        </div>
        <p id="networkStatusText" class="text-[9px] text-slate-400 font-mono mt-0.5">Savienojas...</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <div id="syncBadge" class="hidden px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-mono font-bold flex items-center gap-1">
        <span>⏳</span>
        <span id="unsyncedCount">0</span>
      </div>

      <button id="switchCamBtn" onclick="switchCameraLens()" class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 text-slate-300 flex items-center justify-center text-xs active:bg-white/20 transition" title="Pārslēgt lēcu">
        📷
      </button>

      <button id="torchBtn" onclick="toggleTorch()" class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 text-slate-300 flex items-center justify-center text-xs active:bg-white/20 transition" title="Zibspuldze">
        🔦
      </button>

      <button onclick="openSettingsModal()" class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 text-slate-300 flex items-center justify-center text-xs active:bg-white/20 transition">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Režīmi -->
  <div class="px-3 pt-2 pb-1 shrink-0 bg-slate-950">
    <div class="grid grid-cols-3 gap-1 p-1 bg-slate-900 border border-white/10 rounded-2xl">
      <button id="modeBtn_inventory" onclick="setAppMode('inventory')" class="py-1.5 text-xs font-bold rounded-xl transition bg-emerald-600 text-white shadow-xs">

      </button>
      <button id="modeBtn_labels" onclick="setAppMode('labels')" class="py-1.5 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">
        Cenu zīmes

      <button id="modeBtn_pricecheck" onclick="setAppMode('pricecheck')" class="py-1.5 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white">
        Pārbaude
      </button>
    </div>
  </div>

  <!-- Kameras zona -->
  <main class="flex-1 flex flex-col px-3 py-1 gap-2 overflow-hidden relative">
    
    <div class="relative w-full aspect-[4/3] max-h-[32vh] bg-black rounded-3xl overflow-hidden border border-white/10 shadow-2xl flex items-center justify-center">
      <div id="reader" class="w-full h-full"></div>
      <div id="scanLaserLine" class="scanner-laser"></div>
      
      <div class="absolute inset-x-12 inset-y-6 border-2 border-emerald-500/40 rounded-2xl pointer-events-none flex flex-col justify-between p-2">
        <div class="flex justify-between">
          <span class="w-3 h-3 border-t-2 border-l-2 border-emerald-400"></span>
          <span class="w-3 h-3 border-t-2 border-r-2 border-emerald-400"></span>
        </div>
        <div class="flex justify-between">
          <span class="w-3 h-3 border-b-2 border-l-2 border-emerald-400"></span>
          <span class="w-3 h-3 border-b-2 border-r-2 border-emerald-400"></span>
        </div>
      </div>

      <div id="cameraPausedOverlay" class="hidden absolute inset-0 bg-black/80 backdrop-blur-xs flex flex-col items-center justify-center text-center p-3 z-20">
        <span class="text-3xl text-emerald-400 mb-1">✓</span>
        <p class="text-xs font-bold text-emerald-400 font-mono">Kods fiksēts</p>

      <button onclick="promptManualEan()" class="text-[11px] text-emerald-400 underline font-mono active:text-emerald-300">Ievadīt ar roku ⌨️</button>
    </div>

    <!-- Pēdējās preces ar notīrīšanas pogu -->

        <span id="listTitleLabel">Pēdējie skenējumi:</span>
        <button onclick="clearLocalScansHistory()" class="text-[10px] text-red-400 hover:text-red-300 font-mono underline">

  <!-- Ciparnīcas Modālis -->

    <div class="w-full max-w-sm mx-auto bg-slate-900 border border-white/15 rounded-3xl p-3.5 space-y-2.5 shadow-2xl">
      
      <div class="p-2.5 rounded-2xl bg-white/5 border border-white/10 space-y-0.5">
        <div class="flex items-start justify-between gap-2">
          <h2 id="modalItemName" class="text-xs sm:text-sm font-bold text-white leading-tight line-clamp-2">Prece...</h2>
          <span id="modalItemPrice" class="shrink-0 px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-xs font-mono font-bold">0.00 €</span>

      <div id="unknownItemBlock" class="hidden space-y-1.5 p-2 rounded-2xl bg-amber-500/10 border border-amber-500/30">

            <input type="file" id="itemPhotoInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCaptured(event)">
          </label>
          <div id="photoThumbnail" class="hidden w-7 h-7 rounded-lg border border-amber-400/40 overflow-hidden shrink-0">
            <img id="photoPreviewImg" class="w-full h-full object-cover" src="" alt="preview">
          </div>
        </div>

      <div class="flex items-center justify-between px-3 py-1.5 bg-black/60 rounded-2xl border border-white/10">
        <span class="text-[11px] font-mono uppercase font-bold text-slate-400">Daudzums:</span>
        <div class="flex items-baseline gap-1">
          <span id="keypadDisplay" class="text-2xl font-bold font-mono text-emerald-400">1</span>
          <span class="text-xs text-slate-400 font-mono">gab / kg</span>
        </div>
      </div>

      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="addPresetQty(0.5)" class="py-1 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] font-mono text-slate-300 border border-white/5 active:scale-95">+0.5</button>
        <button onclick="addPresetQty(1.0)" class="py-1 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] font-mono text-slate-300 border border-white/5 active:scale-95">+1.0</button>
        <button onclick="addPresetQty(5.0)" class="py-1 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] font-mono text-slate-300 border border-white/5 active:scale-95">+5</button>
        <button onclick="addPresetQty(10.0)" class="py-1 bg-white/5 hover:bg-white/10 rounded-xl text-[11px] font-mono text-slate-300 border border-white/5 active:scale-95">+10</button>

      <div class="grid grid-cols-3 gap-1.5 pt-0.5">

        <button onclick="pressDigit('3')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">3</button>
        <button onclick="pressDigit('4')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">4</button>
        <button onclick="pressDigit('5')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">5</button>
        <button onclick="pressDigit('6')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">6</button>
        <button onclick="pressDigit('7')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">7</button>
        <button onclick="pressDigit('8')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">8</button>
        <button onclick="pressDigit('9')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">9</button>
        <button onclick="pressDigit('.')" class="numkey py-2.5 bg-white/5 rounded-2xl text-xl font-bold font-mono text-slate-300 transition">.</button>
        <button onclick="pressDigit('0')" class="numkey py-2.5 bg-white/10 rounded-2xl text-lg font-bold font-mono text-white transition">0</button>
        <button onclick="pressBackspace()" class="numkey py-2.5 bg-red-500/20 text-red-400 rounded-2xl text-sm font-bold font-mono transition">⌫</button>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="cancelScan()" class="w-1/3 py-2.5 rounded-2xl bg-white/10 text-slate-300 text-xs font-bold active:scale-95 transition">
          Atcelt

        <button onclick="confirmScan()" class="flex-1 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-bold shadow-lg shadow-emerald-600/30 active:scale-95 transition flex items-center justify-center gap-1.5">

      </div>

    </div>

  <!-- Pozīcijas labošana -->

      <div class="flex items-center justify-between pb-1.5 border-b border-white/10">

        <button onclick="closeEditModal()" class="text-slate-400 p-1 font-bold">✕</button>
      </div>

      <div>
        <p id="editItemName" class="text-xs font-bold text-white line-clamp-1">Prece</p>
        <p id="editItemEan" class="text-[10px] font-mono text-slate-400">0000000000000</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="adjustEditQty(-1)" class="w-11 h-11 rounded-xl bg-white/10 text-lg font-bold text-white">-</button>
        <input type="number" id="editQtyInput" step="any" class="flex-1 h-11 text-center text-xl font-bold font-mono bg-black/50 border border-white/20 rounded-xl text-emerald-400 focus:outline-none">
        <button onclick="adjustEditQty(1)" class="w-11 h-11 rounded-xl bg-white/10 text-lg font-bold text-white">+</button>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="deleteCurrentEditScan()" class="w-1/3 py-2.5 rounded-xl bg-red-500/20 text-red-400 text-xs font-bold active:scale-95">
          Dzēst
        </button>
        <button onclick="saveCurrentEditScan()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold active:scale-95">
          Atjaunot

    </div>

  <!-- Iestatījumi -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-white/15 rounded-3xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 class="text-xs font-bold text-white uppercase font-mono">Iestatījumi</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 p-1 font-bold">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-400 font-mono mb-1">Darbinieks / Ierīce:</label>
          <input type="text" id="settingDeviceId" class="w-full px-3 py-2 text-xs bg-black/40 border border-white/15 rounded-xl text-white font-mono focus:outline-none">
        </div>

        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-400 font-mono mb-1">Veikala / Sesijas ID (Room):</label>
          <input type="text" id="settingRoomId" class="w-full px-3 py-2 text-xs bg-black/40 border border-white/15 rounded-xl text-white font-mono focus:outline-none">
        </div>

        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-400 font-mono mb-1">Izvēlētā kamera:</label>
          <select id="cameraSelectDropdown" onchange="onCameraSelectedFromDropdown(this.value)" class="w-full px-3 py-2 text-xs bg-black/40 border border-white/15 rounded-xl text-white font-mono focus:outline-none"></select>
        </div>

        <div class="pt-2 border-t border-white/5 space-y-2">
          <button onclick="manualSync()" class="w-full py-2 rounded-xl bg-white/10 text-xs font-semibold text-slate-200">
            Piespiedu sinhronizācija 🔄
          </button>
          <button onclick="clearCatalogData()" class="w-full py-2 rounded-xl bg-red-500/10 text-xs font-semibold text-red-400">
            Iztīrīt preču katalogu 🗑️
          </button>
        </div>
      </div>

      <button onclick="saveSettings()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">
        Saglabāt
      </button>
    </div>
  </div>

  <script>
    let html5QrScanner = null;
    let mqttClient = null;
    let isTorchOn = false;
    let cameraTrack = null;
    let localCatalog = new Map();
    let activeScanData = null;
    let currentEditScanId = null;
    let capturedPhotoBase64 = null;
    let isCameraRunning = false;
    let wakeLock = null;

    let availableCameras = [];
    let currentCameraIndex = 0;
    let keypadValue = "1";
    let isKeypadResetOnNextDigit = true;

    let appMode = localStorage.getItem('ean_app_mode') || 'inventory';

    function setAppMode(mode) {
      appMode = mode;
      localStorage.setItem('ean_app_mode', mode);

      const btns = {
        inventory: document.getElementById('modeBtn_inventory'),
        labels: document.getElementById('modeBtn_labels'),
        pricecheck: document.getElementById('modeBtn_pricecheck')
      };

      Object.keys(btns).forEach(k => {
        if (k === mode) {
          btns[k].className = "py-1.5 text-xs font-bold rounded-xl transition bg-emerald-600 text-white shadow-xs";
        } else {
          btns[k].className = "py-1.5 text-xs font-semibold rounded-xl transition text-slate-400 hover:text-white";
        }
      });

      const titleEl = document.getElementById('listTitleLabel');
      if (titleEl) {
        if (mode === 'inventory') titleEl.innerText = "Pēdējie inventūras skenējumi:";
        else if (mode === 'labels') titleEl.innerText = "Cenu zīmju rinda:";
        else titleEl.innerText = "Pārbaudītās preces:";
      }

      renderRecentScans();
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'hidden') {
        await stopCameraSafely();
      } else if (document.visibilityState === 'visible') {
        requestWakeLock();
        setTimeout(() => {
          if (!isCameraRunning && !activeScanData) {
            startCameraWithSelectedLens();
          }
        }, 300);
      }
    });

    function playAudioTone(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'warning') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.21);
        }
      } catch (e) {}
    }

    function triggerHaptic(type = 'short') {
      if (!navigator.vibrate) return;
      if (type === 'short') navigator.vibrate(50);
      else if (type === 'warning') navigator.vibrate([70, 50, 70]);
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('EanScannerDB_v3', 1);
        req.onupgradeneeded = (e) => {
          const db = req.result;
          if (!db.objectStoreNames.contains('scans')) {
            const scansStore = db.createObjectStore('scans', { keyPath: 'id' });
            scansStore.createIndex('synced', 'synced', { unique: false });
            scansStore.createIndex('mode', 'mode', { unique: false });
            scansStore.createIndex('timestamp', 'timestamp', { unique: false });
          }
          if (!db.objectStoreNames.contains('catalog')) {
            db.createObjectStore('catalog', { keyPath: 'ean' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveScanToDb(scanItem) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('scans', 'readwrite');
        tx.objectStore('scans').put(scanItem);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getAllScansFromDb() {
      const db = await openDb();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readonly');
        const req = tx.objectStore('scans').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function markScanSyncedInDb(id) {
      const db = await openDb();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readwrite');
        const store = tx.objectStore('scans');
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          if (getReq.result) {
            const data = getReq.result;
            data.synced = true;
            store.put(data);
          }
          resolve();
        };
        getReq.onerror = () => resolve();
      });
    }

    async function loadCatalogFromDb() {
      const db = await openDb();
      return new Promise((resolve) => {
        const tx = db.transaction('catalog', 'readonly');
        const req = tx.objectStore('catalog').getAll();
        req.onsuccess = () => {
          const items = req.result || [];
          localCatalog.clear();
          items.forEach(it => localCatalog.set(String(it.ean), it));
          updateCatalogStatsUI();
          resolve(localCatalog.size);
        };
        req.onerror = () => resolve(0);
      });
    }

    async function saveCatalogBatchToDb(items) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('catalog', 'readwrite');
        const store = tx.objectStore('catalog');
        items.forEach(it => store.put(it));
        tx.oncomplete = () => {
          items.forEach(it => localCatalog.set(String(it.ean), it));
          updateCatalogStatsUI();
          resolve();
        };
        tx.onerror = () => reject(tx.error);
      });
    }

    function updateCatalogStatsUI() {
      const el = document.getElementById('catalogStatsText');
      if (el) el.innerText = `Bāze: ${localCatalog.size} preces`;
    }

    // Dzēst tikai vietējo skenēšanas vēsturi
    async function clearLocalScansHistory() {
      if (!confirm("Vai tiešām notīrīt skenēšanas sarakstu šajā tālrunī?\n(Datorā dati jau ir saglabāti un netiks dzēsti)")) return;
      const db = await openDb();
      const tx = db.transaction('scans', 'readwrite');
      tx.objectStore('scans').clear();
      tx.oncomplete = () => {
        renderRecentScans();
        updateSyncQueueBadge(0);
      };
    }

    function getDeviceId() {
      let id = localStorage.getItem('ean_device_id');
      if (!id) {
        id = 'Mob-' + Math.floor(100 + Math.random() * 900);
        localStorage.setItem('ean_device_id', id);
      }
      return id;
    }

    function getRoomId() {
      const hash = window.location.hash.replace('#', '');
      const params = new URLSearchParams(hash);
      const roomFromHash = params.get('room');
      if (roomFromHash) {
        localStorage.setItem('ean_room_id', roomFromHash);
        return roomFromHash;
      }
      return localStorage.getItem('ean_room_id') || 'veikals-1';
    }

    function updateDeviceHeaderUI() {
      document.getElementById('displayDeviceId').innerText = getDeviceId();
      document.getElementById('displayRoomId').innerText = `(@${getRoomId()})`;
    }

    function initMqtt() {
      const roomId = getRoomId();
      const deviceId = getDeviceId();
      const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';

      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
      }

      updateMqttBadge(false, "Savienojas...");

      mqttClient = mqtt.connect(brokerUrl, {
        clientId: `ean_mob_${deviceId}_${Math.random().toString(36).substring(2, 7)}`,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2500
      });

      mqttClient.on('connect', () => {
        updateMqttBadge(true, "Tiešsaistē");
        mqttClient.subscribe([
          `ean2026/${roomId}/catalog`,
          `ean2026/${roomId}/ack/${deviceId}`
        ]);
        mqttClient.publish(`ean2026/${roomId}/ping`, JSON.stringify({ deviceId, time: Date.now() }));
        syncOfflineQueue();
      });

      mqttClient.on('message', async (topic, msg) => {
        try {
          const payload = JSON.parse(msg.toString());
          if (topic.endsWith('/catalog') && Array.isArray(payload.items)) {
            await saveCatalogBatchToDb(payload.items);
            playAudioTone('success');
          }
          if (topic.includes(`/ack/${deviceId}`) && payload.scanId) {
            await markScanSyncedInDb(payload.scanId);
            updateSyncQueueBadge();
          }
        } catch (e) {}
      });

      mqttClient.on('offline', () => updateMqttBadge(false, "Bezsaiste"));
      mqttClient.on('error', () => updateMqttBadge(false, "Tīkla kļūda"));
    }

    function updateMqttBadge(online, text) {
      const dot = document.getElementById('mqttStatusDot');
      const label = document.getElementById('networkStatusText');
      if (dot) dot.className = online ? "w-2.5 h-2.5 rounded-full bg-emerald-500" : "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
      if (label) label.innerText = text;
    }

    async function syncOfflineQueue() {
      const all = await getAllScansFromDb();
      const unsynced = all.filter(x => !x.synced && x.mode !== 'pricecheck');
      updateSyncQueueBadge(unsynced.length);

      if (unsynced.length === 0 || !mqttClient || !mqttClient.connected) return;

      const roomId = getRoomId();
      for (const item of unsynced) {
        mqttClient.publish(`ean2026/${roomId}/scan`, JSON.stringify(item));
      }
    }

    async function updateSyncQueueBadge(count = null) {
      if (count === null) {
        const all = await getAllScansFromDb();
        count = all.filter(x => !x.synced && x.mode !== 'pricecheck').length;
      }
      const badge = document.getElementById('syncBadge');
      const label = document.getElementById('unsyncedCount');
      if (badge && label) {
        if (count > 0) {
          badge.classList.remove('hidden');
          label.innerText = count;
        } else {
          badge.classList.add('hidden');
        }
      }
    }

    async function initCameraSystem() {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (!devices || devices.length === 0) return;

        availableCameras = devices;
        let preferredIndex = -1;
        for (let i = 0; i < devices.length; i++) {
          const lbl = (devices[i].label || '').toLowerCase();
          const isBack = lbl.includes('back') || lbl.includes('rear') || lbl.includes('aizmugur');
          const isWide = lbl.includes('wide') || lbl.includes('ultra') || lbl.includes('0.5') || lbl.includes('macro');
          if (isBack && !isWide) {
            preferredIndex = i;
            break;
          }
        }
        if (preferredIndex === -1) preferredIndex = 0;

        currentCameraIndex = preferredIndex;
        populateCameraDropdown();
        await startCameraWithSelectedLens();
      } catch (err) {
        startCameraFallback();
      }
    }

    function populateCameraDropdown() {
      const select = document.getElementById('cameraSelectDropdown');
      if (!select) return;
      select.innerHTML = '';
      availableCameras.forEach((cam, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.text = cam.label || `Kamera ${idx + 1}`;
        if (idx === currentCameraIndex) opt.selected = true;
        select.appendChild(opt);
      });
    }

    async function switchCameraLens() {
      if (availableCameras.length <= 1) {
        alert("Atrasta tikai viena kamera!");
        return;
      }
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      const select = document.getElementById('cameraSelectDropdown');
      if (select) select.value = currentCameraIndex;
      await stopCameraSafely();
      await startCameraWithSelectedLens();
    }

    async function onCameraSelectedFromDropdown(idxStr) {
      currentCameraIndex = parseInt(idxStr) || 0;
      await stopCameraSafely();
      await startCameraWithSelectedLens();
    }

    async function stopCameraSafely() {
      isCameraRunning = false;
      if (html5QrScanner) {
        try { await html5QrScanner.stop(); } catch (e) {}
      }
      cameraTrack = null;
    }

    async function startCameraWithSelectedLens() {
      if (!html5QrScanner) html5QrScanner = new Html5Qrcode("reader");

      const cameraId = availableCameras[currentCameraIndex]?.id;
      const cameraConfig = cameraId ? cameraId : { facingMode: "environment" };

      const scanConfig = {
        fps: 22,
        qrbox: { width: 260, height: 160 },
        aspectRatio: 1.333,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      try {
        await html5QrScanner.start(cameraConfig, scanConfig, onBarcodeDetected, () => {});
        isCameraRunning = true;
        document.getElementById('cameraPausedOverlay').classList.add('hidden');
        document.getElementById('scanLaserLine').classList.remove('hidden');

        setTimeout(() => {
          try {
            const video = document.querySelector('#reader video');
            if (video && video.srcObject) cameraTrack = video.srcObject.getVideoTracks()[0];
          } catch (e) {}
        }, 600);
      } catch (err) {}
    }

    function startCameraFallback() {
      if (!html5QrScanner) html5QrScanner = new Html5Qrcode("reader");
      html5QrScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 260, height: 160 } }, onBarcodeDetected, () => {}).then(() => {
        isCameraRunning = true;
      }).catch(e => {});
    }

    function pauseCamera() {
      document.getElementById('cameraPausedOverlay').classList.remove('hidden');
      document.getElementById('scanLaserLine').classList.add('hidden');
      if (html5QrScanner && isCameraRunning) {
        try { html5QrScanner.pause(true); } catch (e) {}
      }
    }

    function resumeCamera() {
      document.getElementById('cameraPausedOverlay').classList.add('hidden');
      document.getElementById('scanLaserLine').classList.remove('hidden');
      if (html5QrScanner && isCameraRunning) {
        try { html5QrScanner.resume(); } catch (e) {}
      }
    }

    async function toggleTorch() {
      if (!isCameraRunning) {
        alert("Kamera nav palaista!");
        return;
      }
      isTorchOn = !isTorchOn;

      try {
        await html5QrScanner.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
        updateTorchUI(isTorchOn);
      } catch (e1) {
        try {
          if (!cameraTrack) {
            const v = document.querySelector('#reader video');
            if (v && v.srcObject) cameraTrack = v.srcObject.getVideoTracks()[0];
          }
          if (cameraTrack && cameraTrack.applyConstraints) {
            await cameraTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
            updateTorchUI(isTorchOn);
          } else {
            throw new Error();
          }
        } catch (e2) {
          isTorchOn = !isTorchOn;
          alert("Zibspuldze šajā ierīcē/lēcā netiek atbalstīta.");
        }
      }
    }

    function updateTorchUI(on) {
      const btn = document.getElementById('torchBtn');
      if (!btn) return;
      btn.className = on
        ? "w-8 h-8 rounded-xl bg-amber-500 text-black flex items-center justify-center text-xs shadow-md shadow-amber-500/30"
        : "w-8 h-8 rounded-xl bg-white/5 border border-white/10 text-slate-300 flex items-center justify-center text-xs";
    }

    // Skenēšanas apstrāde un precīzā cena eiro
    async function onBarcodeDetected(decodedText) {
      const cleanEan = String(decodedText || '').trim();
      if (!cleanEan) return;

      const item = localCatalog.get(cleanEan);
      const name = item ? item.nosaukums : 'Nezināma prece';
      // Cena jau ir glabāta eiro (piemēram, "2.99") — nedalām ar 100!
      const priceEur = item && item.cena ? parseFloat(item.cena).toFixed(2) : '0.00';

      if (appMode === 'labels') {
        playAudioTone('success');
        triggerHaptic('short');
        showScanToast(name, cleanEan, priceEur, 1);

        const record = {
          id: 'lbl_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          deviceId: getDeviceId(),
          ean: cleanEan,
          name: name,
          price: priceEur,
          qty: 1,
          mode: 'labels',
          timestamp: Date.now(),
          synced: false
        };
        await saveScanToDb(record);
        sendScanToMqtt(record);
        renderRecentScans();
        updateSyncQueueBadge();
        return;
      }

      if (appMode === 'pricecheck') {
        playAudioTone(item ? 'success' : 'warning');
        triggerHaptic('short');
        showScanToast(name, cleanEan, priceEur, null);
        return;
      }

      pauseCamera();
      if (item) {
        playAudioTone('success');
        triggerHaptic('short');
        openQtyModal(cleanEan, item.nosaukums, priceEur, false);
      } else {
        playAudioTone('warning');
        triggerHaptic('warning');
        openQtyModal(cleanEan, 'Nezināma prece', '0.00', true);
      }
    }

    function showScanToast(name, ean, price, qty) {
      const overlay = document.getElementById('toastScanOverlay');
      const title = document.getElementById('toastScanTitle');
      const sub = document.getElementById('toastScanSub');
      const qtyEl = document.getElementById('toastScanQty');

      title.innerText = name;
      sub.innerText = `${ean} • ${price} €`;
      if (qty !== null) {
        qtyEl.innerText = `+${qty}`;
        qtyEl.classList.remove('hidden');
      } else {
        qtyEl.classList.add('hidden');
      }

      overlay.classList.remove('hidden');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        overlay.classList.add('hidden');
      }, 1200);
    }

    function promptManualEan() {
      const code = prompt("Ievadiet svītrkodu (EAN):");
      if (code && code.trim()) onBarcodeDetected(code.trim());
    }

    function openQtyModal(ean, name, price, isUnknown) {
      activeScanData = { ean, name, price, isUnknown };
      capturedPhotoBase64 = null;
      keypadValue = "1";
      isKeypadResetOnNextDigit = true;

      document.getElementById('modalItemName').innerText = name;
      document.getElementById('modalItemEan').innerText = ean;
      document.getElementById('modalItemPrice').innerText = `${price} €`;
      document.getElementById('keypadDisplay').innerText = keypadValue;

      const unknownBlock = document.getElementById('unknownItemBlock');
      const manualName = document.getElementById('manualNameInput');
      const photoThumb = document.getElementById('photoThumbnail');

      if (isUnknown) {
        unknownBlock.classList.remove('hidden');
        manualName.value = '';
        photoThumb.classList.add('hidden');
      } else {
        unknownBlock.classList.add('hidden');
      }

      document.getElementById('qtyModal').classList.remove('hidden');
    }

    function pressDigit(d) {
      if (isKeypadResetOnNextDigit) {
        if (d === '.') keypadValue = "0.";
        else keypadValue = d;
        isKeypadResetOnNextDigit = false;
      } else {
        if (d === '.' && keypadValue.includes('.')) return;
        if (keypadValue.length >= 8) return;
        keypadValue += d;
      }
      document.getElementById('keypadDisplay').innerText = keypadValue;
    }

    function pressBackspace() {
      if (isKeypadResetOnNextDigit) {
        keypadValue = "0";
        isKeypadResetOnNextDigit = false;
      } else {
        keypadValue = keypadValue.slice(0, -1);
        if (keypadValue === '' || keypadValue === '-') keypadValue = "0";
      }
      document.getElementById('keypadDisplay').innerText = keypadValue;
    }

    function addPresetQty(delta) {
      let cur = parseFloat(keypadValue) || 0;
      cur = Math.max(0.001, cur + delta);
      keypadValue = Number.isInteger(cur) ? String(cur) : String(parseFloat(cur.toFixed(3)));
      isKeypadResetOnNextDigit = false;
      document.getElementById('keypadDisplay').innerText = keypadValue;
    }

    function cancelScan() {
      document.getElementById('qtyModal').classList.add('hidden');
      activeScanData = null;
      resumeCamera();
    }

    function handlePhotoCaptured(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 900;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
          document.getElementById('photoPreviewImg').src = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('photoThumbnail').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function confirmScan() {
      if (!activeScanData) return;
      const qty = parseFloat(keypadValue);
      if (isNaN(qty) || qty <= 0) {
        alert("Ievadiet derīgu daudzumu!");
        return;
      }

      let finalName = activeScanData.name;
      if (activeScanData.isUnknown) {
        const m = document.getElementById('manualNameInput').value.trim();
        if (m) finalName = m;
      }

      const scanRecord = {
        id: 'inv_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
        deviceId: getDeviceId(),
        ean: activeScanData.ean,
        name: finalName,
        price: activeScanData.price,
        qty: qty,
        isUnknown: activeScanData.isUnknown,
        photoBase64: capturedPhotoBase64 || null,
        mode: 'inventory',
        timestamp: Date.now(),
        synced: false
      };

      await saveScanToDb(scanRecord);
      sendScanToMqtt(scanRecord);

      document.getElementById('qtyModal').classList.add('hidden');
      activeScanData = null;

      await renderRecentScans();
      updateSyncQueueBadge();
      resumeCamera();
    }

    function sendScanToMqtt(record) {
      const roomId = getRoomId();
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`ean2026/${roomId}/scan`, JSON.stringify(record));
      }
    }

    async function renderRecentScans() {
      const list = document.getElementById('recentScansList');
      const all = await getAllScansFromDb();
      const currentModeScans = all.filter(x => x.mode === appMode);
      currentModeScans.sort((a, b) => b.timestamp - a.timestamp);
      const recent = currentModeScans.slice(0, 10);

      if (recent.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-slate-500 py-4">Šajā režīmā vēl nav skenējumu</p>`;
        return;
      }

      list.innerHTML = '';
      recent.forEach(it => {
        const row = document.createElement('div');
        row.className = "p-2 rounded-xl bg-white/[0.02] hover:bg-white/[0.06] flex items-center justify-between gap-2 transition cursor-pointer";
        row.onclick = () => openEditModal(it.id);

        const timeStr = new Date(it.timestamp).toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const syncDot = it.synced 
          ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>` 
          : `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>`;

        row.innerHTML = `
          <div class="truncate flex-1">
            <div class="flex items-center gap-1.5">
              ${syncDot}
              <p class="text-xs font-semibold text-white truncate">${it.name}</p>
            </div>
            <p class="text-[10px] font-mono text-slate-400">${it.ean} • ${it.price || '0.00'} € • ${timeStr}</p>
          </div>
          <div class="text-right shrink-0">
            <span class="px-2 py-0.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-mono font-bold text-xs">${it.qty} ${Number.isInteger(it.qty) ? 'gab.' : 'kg'}</span>
          </div>
        `;
        list.appendChild(row);
      });
    }

    async function openEditModal(scanId) {
      const all = await getAllScansFromDb();
      const item = all.find(x => x.id === scanId);
      if (!item) return;

      currentEditScanId = scanId;
      document.getElementById('editItemName').innerText = item.name;
      document.getElementById('editItemEan').innerText = `EAN: ${item.ean}`;
      document.getElementById('editQtyInput').value = item.qty;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function adjustEditQty(delta) {
      const el = document.getElementById('editQtyInput');
      let val = parseFloat(el.value) || 0;
      val = Math.max(0.001, val + delta);
      el.value = Number.isInteger(val) ? val : val.toFixed(2);
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      currentEditScanId = null;
    }

    async function saveCurrentEditScan() {
      if (!currentEditScanId) return;
      const newQty = parseFloat(document.getElementById('editQtyInput').value);
      if (isNaN(newQty) || newQty <= 0) return;

      const db = await openDb();
      const tx = db.transaction('scans', 'readwrite');
      const store = tx.objectStore('scans');
      const req = store.get(currentEditScanId);
      req.onsuccess = () => {
        const data = req.result;
        if (data) {
          data.qty = newQty;
          data.synced = false;
          store.put(data);

          const roomId = getRoomId();
          if (mqttClient && mqttClient.connected) {
            mqttClient.publish(`ean2026/${roomId}/scan_update`, JSON.stringify({
              id: data.id,
              qty: newQty,
              deviceId: getDeviceId()
            }));
          }
        }
        closeEditModal();
        renderRecentScans();
        updateSyncQueueBadge();
      };
    }

    async function deleteCurrentEditScan() {
      if (!currentEditScanId || !confirm("Dzēst šo ierakstu?")) return;
      const db = await openDb();
      const tx = db.transaction('scans', 'readwrite');
      tx.objectStore('scans').delete(currentEditScanId);
      tx.oncomplete = () => {
        const roomId = getRoomId();
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`ean2026/${roomId}/scan_delete`, JSON.stringify({
            id: currentEditScanId,
            deviceId: getDeviceId()
          }));
        }
        closeEditModal();
        renderRecentScans();
        updateSyncQueueBadge();
      };
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function openSettingsModal() {
      document.getElementById('settingDeviceId').value = getDeviceId();
      document.getElementById('settingRoomId').value = getRoomId();
      populateCameraDropdown();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const dev = document.getElementById('settingDeviceId').value.trim();
      const room = document.getElementById('settingRoomId').value.trim();
      if (dev) localStorage.setItem('ean_device_id', dev);
      if (room) {
        localStorage.setItem('ean_room_id', room);
        window.location.hash = `#room=${room}`;
      }
      updateDeviceHeaderUI();
      closeSettingsModal();
      initMqtt();
    }

    function manualSync() {
      syncOfflineQueue();
      alert("Sinhronizācija palaista!");
    }

    async function clearCatalogData() {
      if (!confirm("Vai tiešām dzēst preču katalogu?")) return;
      const db = await openDb();
      const tx = db.transaction('catalog', 'readwrite');
      tx.objectStore('catalog').clear();
      tx.oncomplete = () => {
        localCatalog.clear();
        updateCatalogStatsUI();
        alert("Katalogs notīrīts.");
      };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      requestWakeLock();
      updateDeviceHeaderUI();
      setAppMode(appMode);
      await loadCatalogFromDb();
      await renderRecentScans();
      await updateSyncQueueBadge();
      initMqtt();
      initCameraSystem();

      setInterval(() => {
        syncOfflineQueue();
      }, 4000);
    });
  </script>
</body>
